<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>You're offline — Genius Academy</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f8fafc;
      color: #0f172a;
      text-align: center;
      padding: 24px;
    }
    h1 { font-size: 1.25rem; margin-bottom: 8px; }
    p { color: #475569; font-size: 0.9rem; max-width: 320px; }
    button {
      margin-top: 20px;
      background: #0f766e;
      color: white;
      border: none;
      border-radius: 999px;
      padding: 12px 24px;
      font-weight: 600;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <h1>📡 You're offline</h1>
  <p>Check your internet connection. Any lessons you've already opened may still be viewable once you're back online.</p>
  <button onclick="window.location.reload()">Try again</button>
</body>
</html>
